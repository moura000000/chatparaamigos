<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaChat - Online</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat Version para uso direto em HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        .chat-bg {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 16px 16px;
        }
        .dark .chat-bg {
            background-image: radial-gradient(#374151 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans antialiased h-screen overflow-hidden">

    <!-- Configuração do Firebase -->
    <script>
        // Substitua com as credenciais do seu projeto Firebase Console
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO_ID",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>

    <!-- Tela de Autenticação (Login / Cadastro) -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-95 p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md border border-gray-200 dark:border-gray-700">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-white text-2xl font-bold">
                    <i class="fa-solid me-0 fa-comments"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">ConectaChat</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Conecte-se com amigos em tempo real</p>
            </div>

            <!-- Tabs: Entrar / Registrar -->
            <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 pb-3 font-semibold text-blue-600 border-b-2 border-blue-600 text-center">Entrar</button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center">Criar Conta</button>
            </div>

            <!-- Form Error Box -->
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-xs rounded-lg border border-red-300"></div>

            <!-- Formulário de Login -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">E-mail</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Senha</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition text-sm">Entrar no Chat</button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Nome Completo</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Ex: Maria Silva">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Número de Telefone (DDD + Número)</label>
                    <input type="tel" id="reg-phone" required class="w-full px-4 py-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="11999998888">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">E-mail</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Senha (Mínimo 6 caracteres)</label>
                    <input type="password" id="reg-password" required minlength="6" class="w-full px-4 py-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-md transition text-sm">Criar Minha Conta</button>
            </form>
        </div>
    </div>

    <!-- Interface Principal do Chat -->
    <div id="app-container" class="flex h-screen w-full hidden">
        <!-- Sidebar Esquerda -->
        <div class="w-full md:w-80 lg:w-96 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col h-full">
            <!-- Topbar do Usuário Logado -->
            <div class="p-4 bg-slate-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div id="user-avatar" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">U</div>
                    <div>
                        <h2 id="user-display-name" class="font-semibold text-sm text-gray-800 dark:text-white">Carregando...</h2>
                        <span id="user-display-phone" class="text-xs text-gray-500 dark:text-gray-400">---</span>
                    </div>
                </div>
                <button onclick="logout()" title="Sair da Conta" class="p-2 text-gray-500 hover:text-red-500 rounded-lg">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>

            <!-- Ações Rápidas -->
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex space-x-2">
                <button onclick="openAddModal()" class="flex-1 py-2 px-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center justify-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Adicionar Pessoa</span>
                </button>
            </div>

            <!-- Lista de Conversas -->
            <div class="flex-1 overflow-y-auto" id="chats-list">
                <div class="p-4 text-center text-gray-400 text-sm">Carregando conversas...</div>
            </div>
        </div>

        <!-- Área Central de Chat -->
        <div class="hidden md:flex flex-1 flex-col h-full bg-slate-50 dark:bg-gray-900">
            <!-- Header do Chat Ativo -->
            <div id="chat-header" class="p-4 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div id="active-contact-avatar" class="w-10 h-10 rounded-full bg-gray-300 dark:bg-gray-600 flex items-center justify-center text-white font-bold">?</div>
                    <div>
                        <h3 id="active-contact-name" class="font-semibold text-gray-800 dark:text-white">Selecione uma conversa</h3>
                        <p id="active-contact-status" class="text-xs text-emerald-500">ConectaChat Online</p>
                    </div>
                </div>
            </div>

            <!-- Mensagens -->
            <div id="messages-container" class="flex-1 p-4 overflow-y-auto chat-bg space-y-3">
                <div class="flex items-center justify-center h-full text-gray-400 text-sm">
                    Selecione um contato na lista para começar a conversar.
                </div>
            </div>

            <!-- Input de Envio -->
            <div class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
                <form onsubmit="sendMessage(event)" class="flex items-center space-x-2">
                    <input type="text" id="message-input" placeholder="Digite uma mensagem..." class="flex-1 px-4 py-2.5 rounded-full border dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    <button type="submit" class="w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-md">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal para Adicionar Contato -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800 dark:text-white">Adicionar Novo Contato</h3>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="handleAddContactByPhone(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">Telefone da Pessoa (DDD + Número)</label>
                    <input type="tel" id="add-phone-input" required placeholder="Ex: 11999998888" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:text-white outline-none text-sm">
                </div>
                <button type="submit" class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 text-sm">Buscar e Iniciar Conversa</button>
            </form>
        </div>
    </div>

    <!-- Script Principal -->
    <script>
        let currentUser = null;
        let activeChatId = null;

        // Monitorar Estado da Autenticação
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                
                // Buscar dados do perfil do Firestore
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    const userData = doc.data();
                    document.getElementById('user-display-name').innerText = userData.name || user.email;
                    document.getElementById('user-display-phone').innerText = userData.phone || 'Sem número';
                    document.getElementById('user-avatar').innerText = (userData.name || 'U')[0].toUpperCase();
                }
                loadContacts();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        // Alternar Tabs Login/Cadastro
        function switchAuthTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('form-login').classList.toggle('hidden', !isLogin);
            document.getElementById('form-register').classList.toggle('hidden', isLogin);
            
            document.getElementById('tab-login').className = isLogin ? "w-1/2 pb-3 font-semibold text-blue-600 border-b-2 border-blue-600 text-center" : "w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center";
            document.getElementById('tab-register').className = !isLogin ? "w-1/2 pb-3 font-semibold text-emerald-600 border-b-2 border-emerald-600 text-center" : "w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent text-center";
        }

        // Fazer Cadastro
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value.replace(/\D/g, '');
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errBox = document.getElementById('auth-error');

            try {
                errBox.classList.add('hidden');
                const res = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(res.user.uid).set({
                    uid: res.user.uid,
                    name: name,
                    phone: phone,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                errBox.innerText = err.message;
                errBox.classList.remove('hidden');
            }
        }

        // Fazer Login
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errBox = document.getElementById('auth-error');

            try {
                errBox.classList.add('hidden');
                await auth.signInWithEmailAndPassword(email, password);
            } catch (err) {
                errBox.innerText = "Falha no login: " + err.message;
                errBox.classList.remove('hidden');
            }
        }

        // Logout
        function logout() {
            auth.signOut();
        }

        // Modal de Adicionar
        function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

        // Adicionar Contato por Telefone
        async function handleAddContactByPhone(e) {
            e.preventDefault();
            const phone = document.getElementById('add-phone-input').value.replace(/\D/g, '');
            
            const snapshot = await db.collection('users').where('phone', '==', phone).get();
            if (snapshot.empty) {
                alert('Nenhum utilizador encontrado com este número de telefone.');
                return;
            }

            const targetUser = snapshot.docs[0].data();
            if (targetUser.uid === currentUser.uid) {
                alert('Não pode adicionar o seu próprio número.');
                return;
            }

            // Criar ID de conversa único
            const chatId = [currentUser.uid, targetUser.uid].sort().join('_');
            
            await db.collection('chats').doc(chatId).set({
                participants: [currentUser.uid, targetUser.uid],
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            closeAddModal();
            loadContacts();
            selectChat(chatId, targetUser.name);
        }

        // Carregar Contatos
        function loadContacts() {
            db.collection('chats')
              .where('participants', 'array-contains', currentUser.uid)
              .onSnapshot(async (snapshot) => {
                  const list = document.getElementById('chats-list');
                  if (snapshot.empty) {
                      list.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">Nenhuma conversa iniciada. Clique em + Adicionar Pessoa.</div>';
                      return;
                  }

                  list.innerHTML = '';
                  for (let chatDoc of snapshot.docs) {
                      const chatData = chatDoc.data();
                      const otherUid = chatData.participants.find(id => id !== currentUser.uid);
                      const userDoc = await db.collection('users').doc(otherUid).get();
                      const otherUser = userDoc.exists ? userDoc.data() : { name: 'Utilizador' };

                      const item = document.createElement('div');
                      item.className = 'p-3 border-b dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700/50 cursor-pointer flex items-center space-x-3';
                      item.onclick = () => selectChat(chatDoc.id, otherUser.name);
                      item.innerHTML = `
                          <div class="w-10 h-10 rounded-full bg-blue-500 text-white font-bold flex items-center justify-center">${(otherUser.name || 'U')[0].toUpperCase()}</div>
                          <div>
                              <h4 class="font-semibold text-sm text-gray-800 dark:text-white">${otherUser.name}</h4>
                              <p class="text-xs text-gray-400">${otherUser.phone || ''}</p>
                          </div>
                      `;
                      list.appendChild(item);
                  }
              });
        }

        // Selecionar Chat
        function selectChat(chatId, name) {
            activeChatId = chatId;
            document.getElementById('active-contact-name').innerText = name;
            document.getElementById('active-contact-avatar').innerText = name[0].toUpperCase();
            
            // Ouvir Mensagens
            db.collection('chats').doc(chatId).collection('messages')
              .orderBy('timestamp', 'asc')
              .onSnapshot((snapshot) => {
                  const container = document.getElementById('messages-container');
                  container.innerHTML = '';
                  snapshot.forEach(doc => {
                      const msg = doc.data();
                      const isMe = msg.senderId === currentUser.uid;
                      const div = document.createElement('div');
                      div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                      div.innerHTML = `
                          <div class="max-w-xs md:max-w-md px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-white rounded-bl-none shadow-sm'}">
                              ${msg.text}
                          </div>
                      `;
                      container.appendChild(div);
                  });
                  container.scrollTop = container.scrollHeight;
              });
        }

        // Enviar Mensagem
        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            input.value = '';
            await db.collection('chats').doc(activeChatId).collection('messages').add({
                text: text,
                senderId: currentUser.uid,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            await db.collection('chats').doc(activeChatId).update({
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    </script>
</body>
</html>
