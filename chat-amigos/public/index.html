<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat dos amigos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ebff; --ink:#23224a; --muted:#6b6a93; --card:#ffffff;
  --mine:#ffd24a; --accent:#4b3fe0; --line:#d6d9f5;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17163a; --ink:#ecebff; --muted:#9d9cc7; --card:#25235a; --mine:#e0ad1f; --accent:#8d84ff; --line:#34327a; }
  .mine{ color:#23224a; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Nunito",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#login{margin:auto;width:min(380px,90vw);display:flex;flex-direction:column;gap:12px}
#login h1{font-size:2.4rem;font-weight:800;margin:0 0 4px;line-height:1.05}
#login p{margin:0 0 8px;color:var(--muted)}
input{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}
#error{color:#d8294a;min-height:1.2em;margin:0;font-weight:600}

#app{display:none;flex-direction:column;width:min(720px,100%);height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px 18px;border-bottom:2px solid var(--line)}
header h2{margin:0;font-size:1.2rem;font-weight:800}
#online{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
#messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;background:var(--card);padding:8px 12px;border-radius:16px 16px 16px 4px;overflow-wrap:anywhere}
.msg .who{font-size:.8rem;font-weight:800;display:block}
.msg time{font-size:.7rem;color:var(--muted);margin-left:6px;font-weight:400}
.msg.mine{align-self:flex-end;background:var(--mine);color:#23224a;border-radius:16px 16px 4px 16px}
.msg.mine time{color:#5a4a10}
.system{align-self:center;font-size:.8rem;color:var(--muted)}
form#send{display:flex;gap:8px;padding:12px 14px;border-top:2px solid var(--line)}
@media (prefers-reduced-motion:no-preference){ .msg{animation:pop .15s ease-out} @keyframes pop{from{transform:scale(.96);opacity:0}} }
</style>
</head>
<body>

<div id="login">
  <h1>Chat dos amigos</h1>
  <p>Escolhe um nome para entrar.</p>
  <input id="name" placeholder="O teu nome" maxlength="20" autocomplete="nickname">
  <input id="password" type="password" placeholder="Palavra-passe (se houver)">
  <p id="error" role="alert"></p>
  <button class="primary" id="join">Entrar no chat</button>
</div>

<div id="app">
  <header><h2>Chat dos amigos</h2><p id="online"></p></header>
  <div id="messages"></div>
  <form id="send">
    <input id="text" placeholder="Escreve uma mensagem" maxlength="500" autocomplete="off">
    <button class="primary" type="submit">Enviar</button>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = (id) => document.getElementById(id);
let myName = "";

function color(name){
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 45%)`;
}
function addMessage(m){
  const box = $("messages");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const el = document.createElement("div");
  if (m.system){
    el.className = "system"; el.textContent = m.text;
  } else {
    el.className = "msg" + (m.name === myName ? " mine" : "");
    const who = document.createElement("span");
    who.className = "who"; who.textContent = m.name;
    if (m.name !== myName) who.style.color = color(m.name);
    const t = document.createElement("time");
    t.textContent = new Date(m.time).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
    who.appendChild(t);
    const body = document.createElement("span");
    body.textContent = m.text;
    el.append(who, body);
  }
  box.appendChild(el);
  if (nearBottom || m.name === myName) box.scrollTop = box.scrollHeight;
}

function join(){
  const name = $("name").value, password = $("password").value;
  socket.emit("join", { name, password }, (res) => {
    if (!res.ok){ $("error").textContent = res.error; return; }
    myName = name.trim().slice(0,20);
    $("login").style.display = "none";
    $("app").style.display = "flex";
    res.history.forEach(addMessage);
    $("messages").scrollTop = $("messages").scrollHeight;
    $("text").focus();
  });
}
$("join").onclick = join;
$("name").addEventListener("keydown", e => e.key === "Enter" && join());
$("password").addEventListener("keydown", e => e.key === "Enter" && join());

$("send").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("text").value.trim();
  if (!v) return;
  socket.emit("message", v);
  $("text").value = "";
});
socket.on("message", addMessage);
socket.on("users", (list) => {
  $("online").textContent = `${list.length} online: ${list.join(", ")}`;
});
</script>
</body>
</html>
